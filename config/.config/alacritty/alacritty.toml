[env]
TERM = "xterm-256color"

[window]
decorations = "None"
option_as_alt = "Both"
# padding = {x = 5, y = 32}
# padding = {x = 5, y = 5}

# opacity = 0.7
# blur = true
# startup_mode = "SimpleFullscreen"
startup_mode = "Maximized"

[general]
import = [
    # "~/.config/alacritty/themes/themes/tausif_kanagawa_dark_theme.toml"
    # "~/.config/alacritty/themes/themes/github_dark_high_contrast.toml" # -- NOT USED
    # "~/.config/alacritty/themes/themes/github_dark_high_contrast_soft.toml" -- NOT USED
    # "~/.config/alacritty/themes/themes/github_dark_high_contrast_alacritty_background.toml"
    # "~/.config/alacritty/themes/themes/github_dark_high_contrast_hard.toml"
    "~/.config/alacritty/themes/themes/tausif_light_theme_soft.toml"
    # "~/.config/alacritty/themes/themes/gruvbox_light.toml"
    # "~/.config/alacritty/themes/themes/everforest_light.toml"
    # "~/.config/alacritty/themes/themes/dayfox.toml"
    # "~/.config/alacritty/themes/themes/tausif_light_theme.toml"
    # "~/.config/alacritty/themes/themes/github_light_high_contrast.toml"
    # "~/.config/alacritty/themes/themes/tausif_dark_theme.toml" -- NOT USED
    # "~/.config/alacritty/themes/themes/gruvbox_dark.toml" -- NOT USED
]

[font]
# normal = { family = "MonaspiceNe Nerd Font Mono", style = "Regular" }
normal = { family = "Hack Nerd Font Mono", style = "Regular" }
# normal = { family = "FiraMono Nerd Font Mono", style = "Regular" }
size = 11.75

[cursor]
style = { blinking = "Always" }
blink_interval = 300
blink_timeout = 0

# Make Ctrl+Shift+<key> reach tmux, for the `C-a C-S-<X>` pane-placement bindings in
# tmux/.tmux.conf. Alacritty doesn't negotiate extended keys (Ghostty does), so without
# this Ctrl+Shift+C collapses to a plain Ctrl+C and silently triggers the position-2
# binding instead. These send the sequences tmux parses as C-S-C / C-S-R / C-S-T / C-S-D:
# CSI-u form `ESC [ <codepoint> ; 6 u`, where 6 = ctrl+shift and the codepoint is the
# SHIFTED (uppercase) letter -- that is the variant tmux matches to C-S-<UPPERCASE>.
[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
chars = "\u001b[67;6u" # 67 = "C"

[[keyboard.bindings]]
key = "R"
mods = "Control|Shift"
chars = "\u001b[82;6u" # 82 = "R"

[[keyboard.bindings]]
key = "T"
mods = "Control|Shift"
chars = "\u001b[84;6u" # 84 = "T"

[[keyboard.bindings]]
key = "D"
mods = "Control|Shift"
chars = "\u001b[68;6u" # 68 = "D"
